name: Temporary Oxfmt Diagnostic

on:
  push:
    branches:
      - 'feat/team-scoped-upload-refs'

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --write packages/desktop/src/renderer/hooks/file/useDragUpload.ts
      - name: Print exact formatter delta
        run: git diff -- packages/desktop/src/renderer/hooks/file/useDragUpload.ts
